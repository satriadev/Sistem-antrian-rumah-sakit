<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian IGD - Panel Petugas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen font-sans text-gray-800">

    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-900 to-blue-700 text-white rounded-xl shadow-lg p-6 mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight">🏥 Sistem Antrian IGD</h1>
            <p class="text-blue-200 mt-2 text-sm md:text-base">Panel Petugas Triage</p>
        </header>

        <!-- Dashboard Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Kolom Kiri: Form Pendaftaran -->
            <div class="lg:row-span-2 bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 text-blue-900 flex items-center gap-2">
                    <span>📝</span> Daftarkan Pasien Baru
                </h2>
                <form id="form-pasien" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                        <input type="text" id="nama" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                            placeholder="Nama pasien">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Umur</label>
                            <input type="number" id="umur" required min="0" max="120"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                placeholder="Umur">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Kondisi</label>
                            <select id="kondisi" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                                <option value="">-- Pilih --</option>
                                <option value="1">1 - Kritis 🚨</option>
                                <option value="2">2 - Darurat 🩺</option>
                                <option value="3">3 - Mendesak 🧑‍⚕️</option>
                                <option value="4">4 - Ringan 👍</option>
                                <option value="5">5 - Non-darurat 👣</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
                        <input type="text" id="alamat"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                            placeholder="Alamat">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Penyakit / Keluhan Utama</label>
                        <input type="text" id="penyakit"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                            placeholder="Cth: Patah Tulang, Demam">
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition duration-200 transform hover:scale-[1.02] active:scale-95 shadow-md">
                        ✅ Daftarkan Pasien
                    </button>
                </form>
            </div>

            <!-- Kolom Kanan Atas: Daftar Antrian -->
            <div class="bg-white rounded-xl shadow-md p-6 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-blue-900 flex items-center gap-2">
                        <span>📋</span> Daftar Antrian
                    </h2>
                    <span id="jumlah-antrian" class="bg-blue-600 text-white px-3 py-1 rounded-full text-sm font-bold">0</span>
                </div>
                <div id="antrian-list" class="flex-1 overflow-y-auto max-h-[400px] space-y-2 pr-1">
                    <p class="text-gray-400 italic text-center py-6">Belum ada pasien. Tambahkan melalui form.</p>
                </div>
            </div>

            <!-- Kolom Kanan Bawah: Panel Panggil -->
            <div class="bg-white rounded-xl shadow-md p-6 flex flex-col">
                <h2 class="text-xl font-semibold text-blue-900 mb-4 flex items-center gap-2">
                    <span>🔔</span> Penanganan
                </h2>
                <div id="sedang-ditangani" class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4 text-center min-h-[70px] flex items-center justify-center">
                    <p class="text-gray-500 italic">-- Belum ada pasien ditangani --</p>
                </div>
                <button id="btn-panggil"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition duration-200 transform hover:scale-[1.02] active:scale-95 shadow-md">
                    🚑 Panggil Pasien Berikutnya
                </button>
                <p id="pesan-panggil" class="text-sm text-center mt-3 text-gray-600"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
