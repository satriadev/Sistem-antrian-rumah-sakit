<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pasien IGD</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
    <div class="flex min-h-screen">
        
        <aside class="w-56 bg-[#0F1B2D] text-white flex flex-col sticky top-0 h-screen overflow-y-auto">
            <div class="px-4 py-6 border-b border-white/10">
                <h1 class="text-sm font-semibold tracking-tight">IGD Antrian</h1>
                <p class="text-[10px] text-blue-200 mt-1">Panel Petugas Triage</p>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <p class="text-[10px] font-semibold uppercase text-gray-400 tracking-wider px-3 mb-2">Utama</p>
                <a href="antrian.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-white/5 text-sm transition">
                    <i class="ti ti-layout-dashboard text-base"></i> Dasbor Antrian
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-teal-900/30 text-teal-300 font-medium text-sm">
                    <i class="ti ti-history text-base"></i> Riwayat Pasien
                </a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col">
            
            <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-10">
                <div>
                    <h2 class="text-lg font-semibold text-gray-900">Riwayat Pasien Ditangani</h2>
                    <p class="text-xs text-gray-500 mt-1">Cari dan telusuri pasien yang sudah selesai ditangani</p>
                </div>
            </header>

            <div class="p-6 max-w-6xl mx-auto w-full">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
                    <div class="flex gap-3">
                        <input type="text" id="searchInput" placeholder="Cari nama pasien..."
                            class="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none">
                        <button id="btnSearch"
                            class="bg-[#0F1B2D] cursor-pointer text-white px-5 py-2.5 rounded-lg font-medium text-sm hover:bg-[#1A3A5C] transition flex items-center gap-2">
                            <i class="ti ti-search text-base"></i> Cari
                        </button>
                    </div>
                    <p id="searchInfo" class="text-xs text-gray-500 mt-2"></p>
                </div>

                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                            <i class="ti ti-list-check text-base"></i> Daftar Riwayat
                        </h3>
                        <button id="clearBtn"
                            class="bg-red-500 text-white px-3 py-1.5 cursor-pointer rounded-lg font-medium text-xs hover:bg-red-600 transition flex items-center gap-2">
                            <i class="ti ti-trash text-sm"></i> Hapus Semua
                        </button>
                    </div>
                    <div class="overflow-x-auto max-h-150">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead class="bg-gray-50 border-b border-gray-200 sticky top-0 z-10">
                                <tr>
                                    <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">Pasien</th>
                                    <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">Triage</th>
                                    <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">Keluhan</th>
                                    <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">Alamat</th>
                                    <th scope="col" class="px-6 py-3.5 text-xs font-semibold text-gray-500 uppercase tracking-wider">Waktu Ditangani</th>
                                </tr>
                            </thead>
                            <tbody id="riwayatTableBody" class="divide-y divide-gray-100 bg-white">
                                <tr>
                                    <td colspan="5" class="text-sm text-gray-400 italic text-center py-8">Memuat data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="riwayat.js"></script>
</body>
</html>
